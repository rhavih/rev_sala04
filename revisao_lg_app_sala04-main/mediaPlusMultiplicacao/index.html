<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão HTML, CSS, JS</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body>
     <h1>Revisão HTML, CSS, JS</h1>

    <!-- nome, 3 notas, final -> mult * 3 e printar -->
    <main>
        <div class="wrap-inputs">
            <label for="nome">Nome:</label>
            <input id="nome" type="text" placeholder="Insira seu nome">
        </div>

        <div class="wrap-inputs">
            <label for="nota1">Nota 01:</label>
            <input id="nota1" type="number" placeholder="Insira a primeira nota">
        </div>

        <div class="wrap-inputs">
            <label for="nota2">Nota 02:</label>
            <input id="nota2" type="number" placeholder="Insira a segunda nota">
        </div>

        <div class="wrap-inputs">
            <label for="nota3">Nota 03:</label>
            <input id="nota3" type="number" placeholder="Insira a terceira nota">
        </div>

        <button onclick="calcular()">CALCULAR</button>
    </main>

    <p id="resposta"></p>

    <script src="script.js"></script>
</body>
</html>
